<!DOCTYPE html>
	<html lang="ja"
		  xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<meta charset="UTF-8">
	<title>休祝日一覧</title>
</head>
<body>

	<h1 th:text = "${message}">メッセージ</h1>

	<div th:if="${AddSuccess}"
	     style="color: blue;">
	    <p th:text="${AddSuccess}">登録成功メッセージ</p>
	</div>

	<div th:if="${UpdateSuccess}"
	     style="color: blue;">
	    <p th:text="${UpdateSuccess}">更新成功メッセージ</p>
	</div>

	<div th:if="${DeleteSuccess}"
	     style="color: blue;">
	    <p th:text="${DeleteSuccess}">削除成功メッセージ</p>
	</div>
	
	<!-- 祝日一覧表示 -->
	<table th:if = "${allEvents}" border = '1'>
		<thread>
			<tr>
				<th>ID</th>
				<th>日付</th>
				<th>タイプ</th>
				<th>タイトル</th>
				<th>詳細</th>
				<th>作成日</th>
				<th>更新日</th>
				<th colspan="2">-</th>
			</tr>
		</thread>
		<tbody>
			
			<!-- 登録/更新したIDに対する色付処理を追加(th:classappend の部分)	-->
			<!-- 条件：下記2つのどちらかの条件を満たしているかどうか			-->
			<!--   条件①：UpdatedId キー が null ではなく、且つ				-->
			<!--        　 UpdatedId キー と events.eventId が等しいかどうか	-->
			<!--   条件②：AddedId キー が null ではなく、且つ					-->
			<!--        　 AddedId キー と events.eventId が等しいかどうか		-->
			<!-- 真の場合：														-->
			<!--   cssの設定の「added-and-updated-row」を適用する				-->
			<!-- 偽の場合：														-->
			<!--   色付処理はしない												-->
			<tr th:each = "events : ${allEvents}"
				th:classappend=
					"(${UpdatedId != null and events.eventId == UpdatedId}) or (${AddedId != null and events.eventId == AddedId}) ? 'added-and-updated-row' : ''">
				
				<td th:text = "${events.eventId}">Id</td>
				<td th:text = "${events.eventDate}">Date</td>
				<td th:text = "${events.eventType}">Type</td>
				<td th:text = "${events.eventTitle}">Title</td>
				<td th:text = "${events.eventDetail}">Detail</td>
				<td th:text = "${events.createdAt}">Create</td>
				<td th:text = "${events.updatedAt}">Update</td>
				<td>

<!--					<a th:href="@{/list/edit/{selectId}(selectId=${events.eventId})}"-->
<!--					     class="disp-button">編集</a>-->

					 <a th:href="@{/list/edit/{selectId}(selectId=${events.eventId}, from='L')}"
					      class="disp-button">編集</a>
				</td>

				<td>
					<form th:action="@{/list/delete}" method="post">

						<input type="hidden"
								name="Id"
								th:value="${events.eventId}">
									
						<button type="submit"
								class="disp-button"	
								th:onclick="'return confirm(\'ID：' + ${events.eventId} + ' を削除しますか？\');'">
									削除
						</button>

					</form>
				</td>					
				
			</tr>
		</tbody>		
	</table>

	<br>
	<a th:href = "@{/}">メニューに戻る</a>
	
</body>
</html>
