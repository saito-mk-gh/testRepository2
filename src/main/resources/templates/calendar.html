<!DOCTYPE html>
<!--　lang="ja"：日本語ページであることを示すための設定-->
<html lang="ja"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<meta charset="UTF-8">
	<title>カレンダー</title>
</head>

<body>

	<!-- カレンダーの表示年月 -->
	<h2 class="calendar-title">
	    <span th:text="${year}">YYYY</span>年
	    <span th:text="${month}">MM</span>月
	</h2>

	<!-- 表示年月の移動(前月/翌月) -->
	<div class="calendar-nav">

		<a th:href = "@{/}">メニューに戻る</a>
		
		 <a th:href="@{/calendar(
	        year=${prevYear},
	        month=${prevMonth})}">前月</a>

	    <a th:href="@{/calendar}">今月</a>

	    <a th:href="@{/calendar(
	        year=${nextYear},
	        month=${nextMonth})}">翌月</a>
	</div>

	<!-- 曜日表示 -->
	<table class="calendar">
	    <thead>
	        <tr>
	            <th>日</th>
	            <th>月</th>
	            <th>火</th>
	            <th>水</th>
	            <th>木</th>
	            <th>金</th>
	            <th>土</th>
	        </tr>
	    </thead>

		<!-- 各日表示 -->
	    <tbody>

			<!-- これは、weeks の中身を1週間ずつ取り出して			-->
			<!-- <tr> を繰り返し生成する処理						-->
			<!-- ・weeks：Java側から渡された、1か月分の週データ		-->
			<!-- ・week：繰り返しの中で取り出した1週間分のデータ	-->
			<!-- ・<tr>：HTMLのテーブルの1行						-->
			<tr th:each="week : ${weeks}">
				
				<!-- <td th:each="day : ${week}"							-->
				<!--   1週間分のデータから、日付を1日ずつ取り出して			-->
				<!--     <td> を生成する処理								-->
				<!--     													-->
				<!-- th:classappend="${day == null} ? 'empty' : ()"			-->
				<!-- ※th:classappend とは									-->
				<!--     既存の class 属性にクラスを追加するためのもの		-->
	            <td th:each="day : ${week}"
					th:classappend="${day == null} ? 'empty' : (${day.blnHoliday} ? 'holiday' : '')">
					
					<!-- th:if="${day != null} 									-->
					<!--   day が null ではない場合にだけ <span> を表示する処理	-->
					<!--   ・day != null が true なので、<span> が表示される	-->
					<!--   ・day == null の場合は、<span> 自体が生成されない	-->
					<!-- 														-->
					<!-- th:text="${day.dayOfMonth}"							-->
					<!-- 	日付オブジェクトから「日」の部分を取得して表示		-->

					<!-- 日付のみをカレンダーにセット			-->
					<!-- <span th:if="${day != null}"			-->
					<!--       th:text="${day.dayOfMonth}">		-->
					<!--   1									-->
					<!-- </span>								-->

					<!-- 表示する年月のカレンダーを休祝日データ入りに変更（開始）-->
					<span th:if="${day != null}"
					      th:text="${day.targetDate.dayOfMonth}">
					    1
					</span>
					
					<!-- その日の予定をすべて表示 -->
					<div th:if="${day != null}">

						<div th:each="event : ${day.eventsForDate}">
							
					        <span th:text="${event.eventTitle}">
								タイトル
							</span>
							
						</div>
						
					</div>					
					<!-- 表示する年月のカレンダーを休祝日データ入りに変更（終了）-->
					
	            </td>
				
	        </tr>
	    </tbody>
	</table>
	
</body>
</html>
