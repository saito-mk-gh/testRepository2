<!DOCTYPE html>
<!--　lang="ja"：日本語ページであることを示すための設定-->
<html lang="ja"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>カレンダー</title>

	<style>

		/* <body>タグ内に対して適用するCSSの設定									*/
	    body {
	        font-family: sans-serif;	/* フォントの種類を指定するCSSプロパティ	*/
										/* sans-serif：								*/
										/*   ゴシック体のような、文字の端に飾りが	*/
										/*   ない書体の総称							*/
	        margin: 30px;				/* 要素の外側に余白を作る設定				*/
										/* ※margin: 30px → 上下左右すべて30px		*/
	    }

		/* calendar.html における親要素・子要素 						*/
		/*   親要素：表示領域<body>  									*/
		/*   子要素：<table class="calendar">   						*/
		/*																*/
		/* CSSの「.calendar」は、HTMLの <table class="calendar"> を		*/
		/* 指定している。												*/
		/* 親要素・子要素という関係とは別に、classの名前を使って		*/
		/* 設定対象を指定している										*/
		/*																*/
		/*	CSSの書き方と対象											*/
		/*	  table {}：すべての <table> 要素							*/
		/*	  .calendar {} ： class="calendar"の要素					*/
		/*	  .calendar td {}：class="calendar"の要素の中にある<td>要素	*/
		/*	  .calendar th {}：class="calendar"の要素の中にある<th>要素	*/

		/* 表を7列にする */
	    .calendar {
	        width: 100%;				/* 親要素の幅を基準にした子要素の幅：100%	*/
	        max-width: 900px;			/* 子要素の最大幅：900px					*/
	        margin: 0 auto;				/* 左右の余白を自動調整して中央に配置		*/
	        border-collapse: collapse;	/* 隣り合うセルの枠線をまとめて、			*/
										/* 1本の線として表示する設定 				*/
	        table-layout: fixed;		/* テーブルの列幅を固定的に決めるための設定 */
	    }

		/* セルに罫線を付ける */
		/* th：見出しセル。今回は「日」「月」「火」など。	*/
		/* td：通常のセル。今回は日付を表示する場所。		*/
	    .calendar th,
	    .calendar td {
	        border: 1px solid #ccc;	/* border：枠線を設定			*/
										/* solid：実線設定     			*/
										/* #ccc	：線の色設定			*/
										/*			(ccc:薄灰色)		*/
			height: 45px;				/* セルの高さを指定				*/
	        padding: 8px;				/* セル内の余白を指定			*/
	        vertical-align: top;		/* セル内の縦方向の位置を指定	*/
										/*			(top:上側に揃える)	*/
	    }

	    .calendar th {
	        text-align: center;				/* 文字を横方向の中央に揃える	*/
	        background-color: #f2f2f2;	/* 背景色：薄いグレー 			*/
	    }
		
	    /* 日曜日 									*/
		/* ※first-child：							*/
		/*   親要素の中で最初の子要素を意味します	*/
	    .calendar th:first-child,
	    .calendar td:first-child {
	        background-color: #fce4ec;	/* 背景色：ピンク	*/
	        color: #c2185b;				/* 文字色：赤		*/			
	    }

	    /* 土曜日 */
		/* ※last-child：							*/
		/*   親要素の中で最後の子要素を意味します	*/
	    .calendar th:last-child,
	    .calendar td:last-child {
	        background-color: #e1f5fe;	/* 背景色：水色 */
	        color: #0277bd;				/* 文字色：青	*/
	    }
		
		/* ※今回は空欄には日付を表示しないようにしている為、			*/
		/*	 このCSS設定は削除可能										*/
		/*																*/
		/* カレンダーの空欄セルにある文字を透明にして見えなくするCSS	*/
		/* class="calendar"の中にある empty クラス付きの <td>を指定		*/
		/*	 <td class = "empty">●●</td>					*/
		/*																*/
		/*   今回のカレンダーでは、下記コードにて day が null の場合に  */
		/*	 <td class = "empty"></td> が生成される						*/
		/*																*/
		/*		<td th:each="day : ${week}"								*/
		/*		    th:classappend="${day == null} ? 'empty' : ''">		*/
		/*																*/
		.calendar td.empty {
	        color: transparent;	/* 文字色：透明*/
	    }


		/* ※calendar.html内にて、									*/
		/*		<td th:each="day : ${week}"							*/
		/*		    th:classappend="${day == null} ? 'empty' : ''">	*/
		/*		    <span th:if="${day != null}"					*/
		/*		          th:text="${day.dayOfMonth}">1</span>		*/
		/*		</td>												*/
		/*	 の中にある												*/
		/*	   th:if="${day != null}"								*/
		/* によって、day が null の場合は<span>自体が生成されない為	*/
		/*	 このCSS設定は削除可能									*/
		/*															*/
		/* 空欄セル（empty）の中にある <span> を、						*/
		/* 場所や大きさを残したまま見えなくするCSS						*/
		/*																*/
		/* class="calendar"の中にある empty クラス付きの <td>を指定		*/
		/*   ※<td class = "empty"></td>								*/
		/* この<td></td>の中にセットされている<span>が対象				*/
		.calendar td.empty span {
	        visibility: hidden;		/* 要素を見えなくする				*/
									/* 但し、要素が占めるスペースは残る	*/
	    }			

		/* カレンダーのタイトルに対して設定するCSS		 			*/
		/* .calendar-title：										*/
		/*   HTMLの class="calendar-title" が付いている要素を指定	*/
	    .calendar-title {
	        text-align: center;		/* 文字を横方向の中央に揃える	*/
	    }

		/*	前月・今月・翌月リンクに対して設定するCSS				*/
		/* .calendar-nav：											*/
		/*   HTMLの class="calendar-nav" が付いている要素を指定		*/
	    .calendar-nav {
	        text-align: center;		/* 文字を横方向の中央に揃える	*/
	        margin-bottom: 20px;	/* 要素の外側の下に余白を作る	*/
	    }

		/* .calendar-nav a：												*/
		/*   HTMLの class="calendar-nav" の中にある全ての <a> 要素を指定	*/
		 .calendar-nav a {
	        margin: 0 15px;		/* 要素の外側の余白を設定 					*/
								/* 　margin: 上下設定(px) 左右設定(px)		*/
	    }

	</style>

</head>

<body>

	<!-- カレンダーの表示年月 -->
	<h2 class="calendar-title">
	    <span th:text="${year}">YYYY</span>年
	    <span th:text="${month}">MM</span>月
	</h2>

	<!-- 表示年月の移動(前月/翌月) -->
	<div class="calendar-nav">

		<a th:href = "@{/}">メニューに戻る</a>
		
		 <a th:href="@{/calendar(
	        year=${prevYear},
	        month=${prevMonth})}">前月</a>

	    <a th:href="@{/calendar}">今月</a>

	    <a th:href="@{/calendar(
	        year=${nextYear},
	        month=${nextMonth})}">翌月</a>
	</div>

	<!-- 曜日表示 -->
	<table class="calendar">
	    <thead>
	        <tr>
	            <th>日</th>
	            <th>月</th>
	            <th>火</th>
	            <th>水</th>
	            <th>木</th>
	            <th>金</th>
	            <th>土</th>
	        </tr>
	    </thead>

		<!-- 各日表示 -->
	    <tbody>

			<!-- これは、weeks の中身を1週間ずつ取り出して			-->
			<!-- <tr> を繰り返し生成する処理						-->
			<!-- ・weeks：Java側から渡された、1か月分の週データ		-->
			<!-- ・week：繰り返しの中で取り出した1週間分のデータ	-->
			<!-- ・<tr>：HTMLのテーブルの1行						-->
			<tr th:each="week : ${weeks}">
				
				<!-- <td th:each="day : ${week}"							-->
				<!--   1週間分のデータから、日付を1日ずつ取り出して			-->
				<!--     <td> を生成する処理								-->
				<!--     													-->
				<!-- th:classappend="${day == null} ? 'empty' : ''"			-->
				<!-- ※th:classappend とは									-->
				<!--     既存の class 属性にクラスを追加するためのもの		-->
				<!--   day が null かどうかによって、HTMLのクラスを追加		-->
				<!--   ・day == null が true の場合	 → 'empty' を追加		-->
				<!--     ※生成されるhtml：<td class="empty"></td>			-->
				<!--   ・day == null が false の場合 → ''（空文字）を追加	-->
				<!--     ※生成されるhtml：<td></td>						-->
	            <td th:each="day : ${week}"
	                th:classappend="${day == null} ? 'empty' : ''">

					<!-- th:if="${day != null} 									-->
					<!--   day が null ではない場合にだけ <span> を表示する処理	-->
					<!--   ・day != null が true なので、<span> が表示される	-->
					<!--   ・day == null の場合は、<span> 自体が生成されない	-->
					<!-- 														-->
					<!-- th:text="${day.dayOfMonth}"							-->
					<!-- 	日付オブジェクトから「日」の部分を取得して表示		-->
<!--	                <span th:if="${day != null}"-->
<!--	                      th:text="${day.dayOfMonth}">-->
<!--	                    1-->
<!--	                </span>-->

					<!-- 表示する年月のカレンダーを休祝日データ入りに変更-->
					<span th:if="${day != null}"
					      th:text="${day.targetDate.dayOfMonth}">
					    1
					</span>
					
					<!-- その日の予定をすべて表示 -->
					<div th:if="${day != null}">

						<div th:each="event : ${day.eventsForDate}">
							
					        <span th:text="${event.eventTitle}">
								定例会議
							</span>
							
						</div>
						
					</div>					
					<!-- 表示する年月のカレンダーを休祝日データ入りに変更-->
					
	            </td>
				
	        </tr>
	    </tbody>
	</table>
	
</body>
</html>
